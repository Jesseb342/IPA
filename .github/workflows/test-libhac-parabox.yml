name: Test LibHac Parabox NSP Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout extractor
        uses: actions/checkout@v4
        with:
          ref: libhac-ios-aot-probe

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install download tools
        shell: bash
        run: |
          set -euo pipefail
          brew install unar
          python -m pip install --upgrade pip gdown

      - name: Download base NSP and decode prod.keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          KEYS_BASE64: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/parabox-libhac-test"
          mkdir -p "$WORK/input" "$WORK/unpacked" "$WORK/output"
          if [[ -z "${GAME_URL:-}" || -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Game_URL and Keys_URL secrets are required."
            exit 1
          fi

          if [[ "$GAME_URL" == *"drive.google.com"* || "$GAME_URL" == *"docs.google.com"* ]]; then
            gdown "$GAME_URL" -O "$WORK/download"
          else
            curl --fail --location --show-error --retry 3 --retry-delay 5 -o "$WORK/download" "$GAME_URL"
          fi
          test -s "$WORK/download"

          if file "$WORK/download" | grep -qi 'RAR archive'; then
            unar -o "$WORK/unpacked" "$WORK/download"
            NSP_COUNT=0
            while IFS= read -r NSP_PATH; do
              NSP_COUNT=$((NSP_COUNT + 1))
              cp "$NSP_PATH" "$WORK/input/base.nsp"
            done < <(find "$WORK/unpacked" -type f -iname '*.nsp' -print)
            if [[ "$NSP_COUNT" -ne 1 ]]; then
              echo "::error::Expected exactly one NSP in the downloaded RAR; found $NSP_COUNT."
              exit 1
            fi
          else
            python - "$WORK/download" "$WORK/input/base.nsp" <<'PY'
          import shutil, sys
          from pathlib import Path
          source, nsp = map(Path, sys.argv[1:])
          with source.open("rb") as f:
              magic = f.read(4)
          if magic != b"PFS0":
              raise SystemExit(f"Expected a base NSP (PFS0); got {magic.hex(' ')}")
          shutil.copy2(source, nsp)
          PY
          fi

          python - "$WORK/input/base.nsp" "$WORK/prod.keys" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          nsp, keys = map(Path, sys.argv[1:])
          encoded = re.sub(r"\s+", "", os.environ["KEYS_BASE64"].strip())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Keys_URL is not valid Base64: {exc}")
          if not decoded:
              raise SystemExit("Decoded prod.keys is empty.")
          keys.write_bytes(decoded)
          keys.chmod(0o600)
          print(f"Prepared base NSP ({nsp.stat().st_size:,} bytes) and prod.keys ({len(decoded):,} bytes).")
          PY

      - name: Run LibHac extraction and validate Parabox marker
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/parabox-libhac-test"
          dotnet run --project tools/LibHacAotProbe/HostTest/HostTest.csproj \
            --configuration Release -- \
            "$WORK/prod.keys" "$WORK/input/base.nsp" "$WORK/output/romfs" "Data/globalgamemanagers"

      - name: Clean up game data and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/parabox-libhac-test"
