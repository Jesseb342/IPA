name: Build Universal NxNative Shell

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-shell-build
  cancel-in-progress: false

jobs:
  build-shell:
    name: Build game-free iOS shell
    # Match the upstream shell build's required Xcode 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout ns2ios-shell source
        uses: actions/checkout@v4
        with:
          repository: xinerqu/ns2ios-shell
          ref: main
          fetch-depth: 1

      - name: Checkout IPA import-screen overlay
        uses: actions/checkout@v4
        with:
          repository: Jesseb342/IPA
          ref: ${{ github.sha }}
          path: ipa-overlay

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building upstream ns2ios-shell at $(git rev-parse HEAD)"

      - name: Install shell build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen cmake
          python3 -m pip install --quiet --break-system-packages fonttools \
            || python3 -m pip install --quiet fonttools
          python3 -c "import fontTools; print('fontTools', fontTools.version)"
          xcodebuild -version
          xcodegen --version

      - name: Set up .NET 9 for NativeAOT probe
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Capstone 5 ARM64 disassembler for iOS
        shell: bash
        run: |
          set -euo pipefail
          CAPSTONE_SRC="$RUNNER_TEMP/capstone-5.0.6"
          CAPSTONE_BUILD="$RUNNER_TEMP/capstone-5.0.6-ios"
          FRAMEWORK="$RUNNER_TEMP/NxNativeArm64.framework"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          git clone --depth 1 --branch 5.0.6 https://github.com/capstone-engine/capstone.git "$CAPSTONE_SRC"
          # Capstone 5.0.6's Debian CPack config expands an empty
          # CMAKE_SYSTEM_PROCESSOR as a missing CMake argument under Xcode.
          # Set the iOS target explicitly and quote its comparisons.
          python3 - "$CAPSTONE_SRC/CPackConfig.txt" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          source = source.replace(
              "if(${CMAKE_SYSTEM_PROCESSOR} STREQUAL",
              'if("${CMAKE_SYSTEM_PROCESSOR}" STREQUAL'
          )
          source = source.replace(
              "elseif(${CMAKE_SYSTEM_PROCESSOR} STREQUAL",
              'elseif("${CMAKE_SYSTEM_PROCESSOR}" STREQUAL'
          )
          path.write_text(source)
          PY
          cmake -S "$CAPSTONE_SRC" -B "$CAPSTONE_BUILD" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_ARM64_SUPPORT=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_CSTEST=OFF \
            -DCAPSTONE_INSTALL=OFF
          cmake --build "$CAPSTONE_BUILD" --config Release --target capstone_static
          STATIC_LIB="$(find "$CAPSTONE_BUILD" -name libcapstone.a -print -quit)"
          test -s "$STATIC_LIB"
          mkdir -p "$FRAMEWORK"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -O2 -fvisibility=hidden -dynamiclib \
            -I "$CAPSTONE_SRC/include" \
            ipa-overlay/ios-overlay/native/arm64_capstone.c "$STATIC_LIB" \
            -Wl,-install_name,@rpath/NxNativeArm64.framework/NxNativeArm64 \
            -Wl,-dead_strip -o "$FRAMEWORK/NxNativeArm64"
          cp "$CAPSTONE_SRC/LICENSE.TXT" "$FRAMEWORK/Capstone-LICENSE.txt"
          cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NxNativeArm64</string>
            <key>CFBundleIdentifier</key><string>org.nxnative.arm64</string>
            <key>CFBundleName</key><string>NxNativeArm64</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
          nm -gU "$FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_disassemble_nso'
          echo "Capstone 5 ARM64 framework built for iOS:"
          ls -lh "$FRAMEWORK/NxNativeArm64"

      - name: Build isolated LibHac NativeAOT metadata probe
        id: metadata_probe
        shell: bash
        run: |
          set +e
          PROBE_ROOT="$RUNNER_TEMP/nxn-metadata-probe"
          PUBLISH="$PROBE_ROOT/publish"
          mkdir -p "$PUBLISH"
          dotnet publish ipa-overlay/nativeaot-probe/NxNativeMetadataProbe.csproj \
            --configuration Release \
            --runtime ios-arm64 \
            --output "$PUBLISH" \
            > "$PROBE_ROOT/publish.log" 2>&1
          RESULT=$?
          tail -80 "$PROBE_ROOT/publish.log"
          if [ "$RESULT" -eq 0 ]; then
            DYLIB=$(find "$PUBLISH" -maxdepth 1 -name 'NxNativeMetadataProbe.dylib' -print -quit)
            if [ -z "$DYLIB" ]; then
              echo "NativeAOT publish succeeded but the expected dylib was not found."
              exit 1
            fi
            FRAMEWORK="$PROBE_ROOT/NxNativeMetadataProbe.framework"
            mkdir -p "$FRAMEWORK"
            cp "$DYLIB" "$FRAMEWORK/NxNativeMetadataProbe"
            install_name_tool -rpath @executable_path @executable_path/Frameworks "$FRAMEWORK/NxNativeMetadataProbe"
            install_name_tool -id @rpath/NxNativeMetadataProbe.framework/NxNativeMetadataProbe "$FRAMEWORK/NxNativeMetadataProbe"
            cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NxNativeMetadataProbe</string>
            <key>CFBundleIdentifier</key><string>org.nxnative.metadata-probe</string>
            <key>CFBundleName</key><string>NxNativeMetadataProbe</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
            (cd "$PROBE_ROOT" && zip -qry nxnative-metadata-probe-framework.zip NxNativeMetadataProbe.framework)
            echo "NativeAOT framework packaged successfully."
          else
            echo "NativeAOT probe did not compile; the main shell build will continue."
          fi
          exit "$RESULT"

      - name: Upload LibHac NativeAOT probe and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-metadata-probe-diagnostics
          path: |
            ${{ runner.temp }}/nxn-metadata-probe/publish.log
            ${{ runner.temp }}/nxn-metadata-probe/nxnative-metadata-probe-framework.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Set up .NET 10 for iOS shader translator probe
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Probe Ryujinx shader translator as an iOS NativeAOT library
        id: shader_translator_probe
        shell: bash
        run: |
          set -euo pipefail
          PROBE_ROOT="$RUNNER_TEMP/nxn-shader-translator"
          PUBLISH="$PROBE_ROOT/publish"
          LOG="$PROBE_ROOT/publish.log"
          mkdir -p "$PUBLISH"
          echo "Installing the .NET 10 iOS workload..."
          dotnet workload install ios --skip-manifest-update
          echo "Publishing the Ryujinx translator for iPhone ARM64..."
          dotnet publish ipa-overlay/translator-probe/NxNativeShaderTranslator.csproj \
            --configuration Release \
            --runtime ios-arm64 \
            --output "$PUBLISH" \
            -p:RyuSrc="$GITHUB_WORKSPACE/dm/third_party/ryujinx" \
            > "$LOG" 2>&1
          RESULT=$?
          tail -100 "$LOG"
          if [ "$RESULT" -ne 0 ]; then
            echo "Ryujinx translator NativeAOT probe failed; inspect the uploaded log for the first incompatible dependency or API."
            exit "$RESULT"
          fi
          DYLIB=$(find "$PUBLISH" -maxdepth 1 -name '*.dylib' -print -quit)
          if [ -z "$DYLIB" ]; then
            echo "Publish completed but no iOS dylib was produced."
            exit 1
          fi
          nm -gU "$DYLIB" | grep -q '_nxn_translate_shader_jobs'
          nm -gU "$DYLIB" | grep -q '_nxn_shader_translator_probe'

          # iOS expects third-party dynamic code inside a framework bundle,
          # not as a loose .dylib in the app. Wrap the NativeAOT output now;
          # the app will load it from Frameworks in a later Swift bridge step.
          FRAMEWORK="$PROBE_ROOT/NxNativeShaderTranslator.framework"
          mkdir -p "$FRAMEWORK"
          cp "$DYLIB" "$FRAMEWORK/NxNativeShaderTranslator"
          # The NativeAOT dylib has no existing LC_RPATH entry. Its framework
          # install name is sufficient; the host app supplies Frameworks search path.
          install_name_tool -id \
            @rpath/NxNativeShaderTranslator.framework/NxNativeShaderTranslator \
            "$FRAMEWORK/NxNativeShaderTranslator"
          cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NxNativeShaderTranslator</string>
            <key>CFBundleIdentifier</key><string>org.nxnative.shader-translator</string>
            <key>CFBundleName</key><string>NxNativeShaderTranslator</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          PLIST
          # Apple file output varies across runner images; lipo checks architecture exactly.
          file "$FRAMEWORK/NxNativeShaderTranslator"
          lipo -verify_arch arm64 "$FRAMEWORK/NxNativeShaderTranslator"
          echo "Exported translator entry points:"
          nm -gU "$FRAMEWORK/NxNativeShaderTranslator" | grep '_nxn_.*shader'
          echo "Ryujinx translator built and wrapped as an iOS ARM64 framework:"
          ls -lh "$FRAMEWORK/NxNativeShaderTranslator"
          otool -L "$FRAMEWORK/NxNativeShaderTranslator"

      - name: Upload shader translator NativeAOT probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-shader-translator-ios-probe
          path: |
            ${{ runner.temp }}/nxn-shader-translator/publish.log
            ${{ runner.temp }}/nxn-shader-translator/publish/*.dylib
            ${{ runner.temp }}/nxn-shader-translator/NxNativeShaderTranslator.framework
          if-no-files-found: warn
          retention-days: 7

      - name: Apply IPA import-screen overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s ipa-overlay/ios-overlay/Sources/ImportScreen.swift
          python3 -m py_compile ipa-overlay/ios-overlay/tools/apply_import_ui.py
          cp ipa-overlay/ios-overlay/Sources/ImportScreen.swift dm/ios/Sources/ImportScreen.swift
          cp ipa-overlay/ios-overlay/Sources/OnDeviceMetalCompiler.swift dm/ios/Sources/OnDeviceMetalCompiler.swift
          cp ipa-overlay/ios-overlay/Sources/UnityShaderSourceScanner.swift dm/ios/Sources/UnityShaderSourceScanner.swift
          echo "UnityFS scanner source SHA256:"
          shasum -a 256 ipa-overlay/ios-overlay/Sources/UnityShaderSourceScanner.swift
          echo "UnityFS scanner copied SHA256:"
          shasum -a 256 dm/ios/Sources/UnityShaderSourceScanner.swift
          cmp ipa-overlay/ios-overlay/Sources/UnityShaderSourceScanner.swift dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'unityfs_scanner_revision|prioritize-main-assets-v4-object142-forensics' dm/ios/Sources/UnityShaderSourceScanner.swift
          python3 ipa-overlay/ios-overlay/tools/apply_import_ui.py dm/ios/Sources/front_ios.m
          grep -q 'dm_show_import_screen' dm/ios/Sources/front_ios.m
          grep -q 'Prepare a game' dm/ios/Sources/ImportScreen.swift
          grep -q 'enum OnDeviceMetalCompiler' dm/ios/Sources/OnDeviceMetalCompiler.swift
          grep -q 'enum UnityShaderSourceScanner' dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'Inspect Unity Shader Objects' dm/ios/Sources/ImportScreen.swift
          grep -q 'bigIDEnabled' dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'inspectObjectIndex: Int?' dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'inspectShaderObjectBytes' dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'resources-assets-shader-object-142.bin' dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'shader_object_marker' dm/ios/Sources/UnityShaderSourceScanner.swift
          swiftc -frontend -parse dm/ios/Sources/UnityShaderSourceScanner.swift
          grep -q 'enum ShaderTranslatorBridge' dm/ios/Sources/ImportScreen.swift
          grep -q 'nxn_translate_shader_jobs' dm/ios/Sources/ImportScreen.swift
          grep -q 'Test Shader Translator' dm/ios/Sources/ImportScreen.swift
          grep -q 'ShaderTranslatorBridge.probe()' dm/ios/Sources/ImportScreen.swift
          grep -q 'makeLibrary(source: source, options: options)' dm/ios/Sources/OnDeviceMetalCompiler.swift
          echo "IPA import UI overlay applied."

      # Shader milestone: move from reporting candidate offsets to extracting
      # verified Unity Shader object bytes locally on the iPhone. This gate
      # checks the current scanner contract; it does not process game payloads.
      - name: Validate next shader extraction milestone
        shell: bash
        run: |
          set -euo pipefail
          SCANNER="ipa-overlay/ios-overlay/Sources/UnityShaderSourceScanner.swift"
          REPORT="$RUNNER_TEMP/shader-extraction-next-steps.txt"
          test -s "$SCANNER"
          python3 - "$SCANNER" "$REPORT" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          required = {
              "format-17 little-endian guard": "requires_format_17_little_endian",
              "serialized data offset": "serializedDataOffset",
              "Shader class identification": "classID == 48",
              "object-relative byte start": "object_byte_start=",
              "absolute file offset": "file_offset=",
              "object byte size": "bytes=\\(sizeRaw)",
              "overflow-safe object end": "absoluteEnd >= absoluteStart",
              "file-bound validation": "absoluteEnd <= UInt64(bytes.count)",
              "candidate record": "shader_object_candidate|",
          }
          missing = [label for label, token in required.items() if token not in source]
          if missing:
              raise SystemExit("Shader scanner contract missing: " + ", ".join(missing))

          plan = """Cuphead shader investigation — immediate next steps
          1. Inspect Data/resources.assets Shader object index 142 (previously reported as 5,064,092 bytes).
          2. On the iPhone, save its exact bounded raw bytes to Documents/PreparedGame/ShaderSources/resources-assets-shader-object-142.bin.
          3. Inventory its prefix and embedded printable strings/metadata markers to learn whether it contains shader variants and where program records may begin.
          4. Use the resulting report and raw object layout to identify Unity metadata boundaries versus actual shader program payloads; do not treat string hits as proof of executable code.
          5. Parse the confirmed serialized program records, extract Switch shader machine code and metadata, and build translator job JSON.
          6. Run the embedded Ryujinx translator on-device, then compile generated Metal source with Apple's Metal compiler.
          7. Verify the first real Cuphead shader output and preserve a copyable diagnostic report.
          
          Current boundary: this workflow only validates source-code prerequisites. It does not access, upload, or convert any user game files or keys. Object inspection, extraction, and translation execute inside the iOS app sandbox.
          """
          Path(sys.argv[2]).write_text(plan)
          print("Verified all current Unity shader candidate-offset safeguards.")
          print(plan)
          PY

      - name: Keep compiled shell executable out of resource-size false positive
        shell: bash
        run: |
          set -euo pipefail
          python3 - dm/ios/tools/shell_build.sh <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = '''big=$(find "$A" -type f -size +8M -not -path '*/dm/font/*' | head -5)'''
          new = '''big=$(find "$A" -type f -size +8M -not -path '*/dm/font/*' -not -path "$A/DmIOS" | head -5)'''
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one upstream shell size guard; refusing an unsafe patch.")
          path.write_text(source.replace(old, new))
          print("Size guard now checks oversized app resources while allowing the compiled DmIOS executable.")
          PY
          grep -Fq ' -not -path "$A/DmIOS"' dm/ios/tools/shell_build.sh

      - name: Build game-free shell
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          bash dm/ios/tools/shell_build.sh
          SHELL_ZIP="$DM_ROOT/build/shell/nxnative-shell-build-input.zip"
          test -s "$SHELL_ZIP"
          ls -lh "$SHELL_ZIP"

      - name: Embed and sign LibHac metadata framework
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          PROBE_ROOT="$RUNNER_TEMP/nxn-metadata-probe"
          APP="$DM_ROOT/build/shell/app"
          FRAMEWORKS="$APP/Frameworks"
          FRAMEWORK="$FRAMEWORKS/NxNativeMetadataProbe.framework"
          test -s "$PROBE_ROOT/nxnative-metadata-probe-framework.zip" || {
            echo "::error::The LibHac NativeAOT framework was not produced."
            exit 1
          }
          mkdir -p "$FRAMEWORKS"
          unzip -q "$PROBE_ROOT/nxnative-metadata-probe-framework.zip" -d "$RUNNER_TEMP"
          cp -R "$RUNNER_TEMP/NxNativeMetadataProbe.framework" "$FRAMEWORK"
          test -s "$FRAMEWORK/NxNativeMetadataProbe"
          test -s "$FRAMEWORK/Info.plist"
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_arm64_encoder_selftest'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_inspect_nsp'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_extract_game'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_extract_dlc'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_inspect_nso'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_rewrite_nso'

          # Embed the Ryujinx NativeAOT translator as a real iOS framework.
          TRANSLATOR_FRAMEWORK="$FRAMEWORKS/NxNativeShaderTranslator.framework"
          SOURCE_TRANSLATOR="$RUNNER_TEMP/nxn-shader-translator/NxNativeShaderTranslator.framework"
          test -s "$SOURCE_TRANSLATOR/NxNativeShaderTranslator"
          cp -R "$SOURCE_TRANSLATOR" "$TRANSLATOR_FRAMEWORK"
          test -s "$TRANSLATOR_FRAMEWORK/Info.plist"
          nm -gU "$TRANSLATOR_FRAMEWORK/NxNativeShaderTranslator" | grep -q '_nxn_translate_shader_jobs'
          nm -gU "$TRANSLATOR_FRAMEWORK/NxNativeShaderTranslator" | grep -q '_nxn_shader_translator_probe'

          ARM64_FRAMEWORK="$FRAMEWORKS/NxNativeArm64.framework"
          cp -R "$RUNNER_TEMP/NxNativeArm64.framework" "$ARM64_FRAMEWORK"
          test -s "$ARM64_FRAMEWORK/NxNativeArm64"
          nm -gU "$ARM64_FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_disassemble_nso'
          nm -gU "$ARM64_FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_analyze_nso'
          nm -gU "$ARM64_FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_inspect_function'
          nm -gU "$ARM64_FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_discover_linker_stubs'

          # Sign both nested frameworks before re-signing the containing app.
          codesign --force --sign - --timestamp=none "$ARM64_FRAMEWORK"
          codesign --force --sign - --timestamp=none "$TRANSLATOR_FRAMEWORK"
          codesign --force --sign - --timestamp=none "$FRAMEWORK"
          codesign --force --sign - --timestamp=none \
            --entitlements dm/ios/DmIOS.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'increased-memory-limit'

          # Rebuild the shell input archive so it includes the embedded framework.
          cd "$DM_ROOT/build/shell"
          rm -f nxnative-shell-build-input.zip
          rm -rf Payload
          mkdir Payload
          cp -R app Payload/DmIOS.app
          zip -qry nxnative-shell-build-input.zip Payload
          rm -rf Payload
          unzip -t nxnative-shell-build-input.zip >/dev/null
          echo "Embedded and signed the LibHac, Capstone, and Ryujinx translator frameworks."
          ls -lh "$FRAMEWORK/NxNativeMetadataProbe" "$TRANSLATOR_FRAMEWORK/NxNativeShaderTranslator"

      - name: Package shell as an IPA for sideload testing
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          SOURCE="$DM_ROOT/build/shell/nxnative-shell-build-input.zip"
          IPA="$DM_ROOT/build/shell/nxnative-universal-shell.ipa"
          test -s "$SOURCE"
          cp "$SOURCE" "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | grep -qx 'Payload/DmIOS.app/Info.plist'
          unzip -Z1 "$IPA" | grep -qx 'Payload/DmIOS.app/DmIOS'
          echo "Created IPA-format package:"
          ls -lh "$IPA"

      - name: Verify import screen was compiled into the app
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          APP="$DM_ROOT/build/shell/app"
          test -s "$APP/DmIOS" || { echo "::error::Missing compiled app executable: $APP/DmIOS"; exit 1; }

          # The overlay application step already verifies the source copy.
          # Check the actual Mach-O bytes directly to avoid brittle path/grep checks.
          python3 - "$APP/DmIOS" <<'PY'
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1])
          data = binary.read_bytes()
          required = (b"ImportScreenView", b"_dm_show_import_screen", b"Scan Unity Shader Sources", b"NxNativeMetadataProbe.framework", b"nxn_inspect_nsp", b"nxn_extract_game", b"nxn_extract_dlc", b"nxn_inspect_nso", b"nxn_rewrite_nso", b"nxn_arm64_encoder_selftest", b"nxn_arm64_disassemble_nso", b"nxn_arm64_analyze_nso", b"nxn_arm64_inspect_function", b"nxn_arm64_discover_linker_stubs")
          missing = [item.decode() for item in required if item not in data]
          if missing:
              print("::error::Compiled import screen symbols missing: " + ", ".join(missing))
              raise SystemExit(1)
          print("Import screen view and native bridge are present in the compiled app.")
          PY

      - name: Verify shell contains no game payload
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          APP="$DM_ROOT/build/shell/app"
          test -d "$APP"
          test -s "$APP/dm/shell_info.txt"
          grep -q '^KIND=ios$' "$APP/dm/shell_info.txt"
          grep -q '^GUEST=1$' "$APP/dm/shell_info.txt"
          grep -q '^ENV=1$' "$APP/dm/shell_info.txt"
          for item in romfs msl aoc; do
            if [ -e "$APP/$item" ]; then
              echo "::error::Game-specific payload unexpectedly present: $item"
              exit 1
            fi
          done
          if find "$APP" -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nca' -o -iname '*.tik' -o -iname '*.keys' -o -iname 'prod.keys' \) | grep -q .; then
            echo "::error::A game package or key file was found in the shell."
            exit 1
          fi
          test -s "$APP/Frameworks/NxNativeMetadataProbe.framework/NxNativeMetadataProbe" || {
            echo "::error::The LibHac metadata framework is missing from the app."
            exit 1
          }
          test -s "$APP/Frameworks/NxNativeShaderTranslator.framework/NxNativeShaderTranslator" || {
            echo "::error::The Ryujinx shader translator framework is missing from the app."
            exit 1
          }
          nm -gU "$APP/Frameworks/NxNativeShaderTranslator.framework/NxNativeShaderTranslator" | grep -q '_nxn_translate_shader_jobs'
          nm -gU "$APP/Frameworks/NxNativeShaderTranslator.framework/NxNativeShaderTranslator" | grep -q '_nxn_shader_translator_probe'
          if find "$APP/Frameworks" -mindepth 1 -maxdepth 1 ! -name 'NxNativeMetadataProbe.framework' ! -name 'NxNativeArm64.framework' ! -name 'NxNativeShaderTranslator.framework' | grep -q .; then
            echo "::error::Unexpected framework or game module found in the shell."
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          echo "Shell metadata:"
          cat "$APP/dm/shell_info.txt"
          echo "Embedded translator framework:"
          file "$APP/Frameworks/NxNativeShaderTranslator.framework/NxNativeShaderTranslator"
          echo "Shell file count: $(find "$APP" -type f | wc -l | tr -d ' ')"


      - name: Upload shader extraction roadmap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuphead-shader-extraction-next-steps
          path: ${{ runner.temp }}/shader-extraction-next-steps.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal shell build input
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-universal-shell
          path: ${{ runner.temp }}/nxnative-shell/build/shell/nxnative-shell-build-input.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload sideloadable IPA package
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-universal-shell-ipa
          path: ${{ runner.temp }}/nxnative-shell/build/shell/nxnative-universal-shell.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-shell-diagnostics
          path: ${{ runner.temp }}/nxnative-shell/build/shell/
          if-no-files-found: warn
          retention-days: 7
