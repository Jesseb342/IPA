name: Build Universal NxNative Shell

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-shell-build
  cancel-in-progress: false

jobs:
  build-shell:
    name: Build game-free iOS shell
    # Match the upstream shell build's required Xcode 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout ns2ios-shell source
        uses: actions/checkout@v4
        with:
          repository: xinerqu/ns2ios-shell
          ref: main
          fetch-depth: 1

      - name: Checkout IPA import-screen overlay
        uses: actions/checkout@v4
        with:
          repository: Jesseb342/IPA
          ref: ${{ github.sha }}
          path: ipa-overlay

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building upstream ns2ios-shell at $(git rev-parse HEAD)"

      - name: Install shell build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen cmake
          python3 -m pip install --quiet --break-system-packages fonttools \
            || python3 -m pip install --quiet fonttools
          python3 -c "import fontTools; print('fontTools', fontTools.version)"
          xcodebuild -version
          xcodegen --version

      - name: Set up .NET 9 for NativeAOT probe
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Capstone 5 ARM64 disassembler for iOS
        shell: bash
        run: |
          set -euo pipefail
          CAPSTONE_SRC="$RUNNER_TEMP/capstone-5.0.6"
          CAPSTONE_BUILD="$RUNNER_TEMP/capstone-5.0.6-ios"
          FRAMEWORK="$RUNNER_TEMP/NxNativeArm64.framework"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          git clone --depth 1 --branch 5.0.6 https://github.com/capstone-engine/capstone.git "$CAPSTONE_SRC"
          cmake -S "$CAPSTONE_SRC" -B "$CAPSTONE_BUILD" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_ARM64_SUPPORT=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_CSTEST=OFF \
            -DCAPSTONE_INSTALL=OFF
          cmake --build "$CAPSTONE_BUILD" --config Release --target capstone_static
          STATIC_LIB="$(find "$CAPSTONE_BUILD" -name libcapstone.a -print -quit)"
          test -s "$STATIC_LIB"
          mkdir -p "$FRAMEWORK"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -O2 -fvisibility=hidden -dynamiclib \
            -I "$CAPSTONE_SRC/include" \
            ipa-overlay/ios-overlay/native/arm64_capstone.c "$STATIC_LIB" \
            -Wl,-install_name,@rpath/NxNativeArm64.framework/NxNativeArm64 \
            -Wl,-dead_strip -o "$FRAMEWORK/NxNativeArm64"
          cp "$CAPSTONE_SRC/LICENSE.TXT" "$FRAMEWORK/Capstone-LICENSE.txt"
          cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NxNativeArm64</string>
            <key>CFBundleIdentifier</key><string>org.nxnative.arm64</string>
            <key>CFBundleName</key><string>NxNativeArm64</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
          nm -gU "$FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_disassemble_nso'
          echo "Capstone 5 ARM64 framework built for iOS:"
          ls -lh "$FRAMEWORK/NxNativeArm64"

      - name: Build isolated LibHac NativeAOT metadata probe
        id: metadata_probe
        shell: bash
        run: |
          set +e
          PROBE_ROOT="$RUNNER_TEMP/nxn-metadata-probe"
          PUBLISH="$PROBE_ROOT/publish"
          mkdir -p "$PUBLISH"
          dotnet publish ipa-overlay/nativeaot-probe/NxNativeMetadataProbe.csproj \
            --configuration Release \
            --runtime ios-arm64 \
            --output "$PUBLISH" \
            > "$PROBE_ROOT/publish.log" 2>&1
          RESULT=$?
          tail -80 "$PROBE_ROOT/publish.log"
          if [ "$RESULT" -eq 0 ]; then
            DYLIB=$(find "$PUBLISH" -maxdepth 1 -name 'NxNativeMetadataProbe.dylib' -print -quit)
            if [ -z "$DYLIB" ]; then
              echo "NativeAOT publish succeeded but the expected dylib was not found."
              exit 1
            fi
            FRAMEWORK="$PROBE_ROOT/NxNativeMetadataProbe.framework"
            mkdir -p "$FRAMEWORK"
            cp "$DYLIB" "$FRAMEWORK/NxNativeMetadataProbe"
            install_name_tool -rpath @executable_path @executable_path/Frameworks "$FRAMEWORK/NxNativeMetadataProbe"
            install_name_tool -id @rpath/NxNativeMetadataProbe.framework/NxNativeMetadataProbe "$FRAMEWORK/NxNativeMetadataProbe"
            cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NxNativeMetadataProbe</string>
            <key>CFBundleIdentifier</key><string>org.nxnative.metadata-probe</string>
            <key>CFBundleName</key><string>NxNativeMetadataProbe</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
            (cd "$PROBE_ROOT" && zip -qry nxnative-metadata-probe-framework.zip NxNativeMetadataProbe.framework)
            echo "NativeAOT framework packaged successfully."
          else
            echo "NativeAOT probe did not compile; the main shell build will continue."
          fi
          exit "$RESULT"

      - name: Upload LibHac NativeAOT probe and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-metadata-probe-diagnostics
          path: |
            ${{ runner.temp }}/nxn-metadata-probe/publish.log
            ${{ runner.temp }}/nxn-metadata-probe/nxnative-metadata-probe-framework.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Apply IPA import-screen overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s ipa-overlay/ios-overlay/Sources/ImportScreen.swift
          python3 -m py_compile ipa-overlay/ios-overlay/tools/apply_import_ui.py
          cp ipa-overlay/ios-overlay/Sources/ImportScreen.swift dm/ios/Sources/ImportScreen.swift
          python3 ipa-overlay/ios-overlay/tools/apply_import_ui.py dm/ios/Sources/front_ios.m
          grep -q 'dm_show_import_screen' dm/ios/Sources/front_ios.m
          grep -q 'Prepare a game' dm/ios/Sources/ImportScreen.swift
          echo "IPA import UI overlay applied."

      - name: Build game-free shell
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          bash dm/ios/tools/shell_build.sh
          SHELL_ZIP="$DM_ROOT/build/shell/nxnative-shell-build-input.zip"
          test -s "$SHELL_ZIP"
          ls -lh "$SHELL_ZIP"

      - name: Embed and sign LibHac metadata framework
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          PROBE_ROOT="$RUNNER_TEMP/nxn-metadata-probe"
          APP="$DM_ROOT/build/shell/app"
          FRAMEWORKS="$APP/Frameworks"
          FRAMEWORK="$FRAMEWORKS/NxNativeMetadataProbe.framework"
          test -s "$PROBE_ROOT/nxnative-metadata-probe-framework.zip" || {
            echo "::error::The LibHac NativeAOT framework was not produced."
            exit 1
          }
          mkdir -p "$FRAMEWORKS"
          unzip -q "$PROBE_ROOT/nxnative-metadata-probe-framework.zip" -d "$RUNNER_TEMP"
          cp -R "$RUNNER_TEMP/NxNativeMetadataProbe.framework" "$FRAMEWORK"
          test -s "$FRAMEWORK/NxNativeMetadataProbe"
          test -s "$FRAMEWORK/Info.plist"
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_arm64_encoder_selftest'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_inspect_nsp'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_extract_game'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_extract_dlc'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_inspect_nso'
          nm -gU "$FRAMEWORK/NxNativeMetadataProbe" | grep -q '_nxn_rewrite_nso'

          ARM64_FRAMEWORK="$FRAMEWORKS/NxNativeArm64.framework"
          cp -R "$RUNNER_TEMP/NxNativeArm64.framework" "$ARM64_FRAMEWORK"
          test -s "$ARM64_FRAMEWORK/NxNativeArm64"
          nm -gU "$ARM64_FRAMEWORK/NxNativeArm64" | grep -q '_nxn_arm64_disassemble_nso'

          # Sign both nested frameworks before re-signing the containing app.
          codesign --force --sign - --timestamp=none "$ARM64_FRAMEWORK"
          codesign --force --sign - --timestamp=none "$FRAMEWORK"
          codesign --force --sign - --timestamp=none \
            --entitlements dm/ios/DmIOS.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'increased-memory-limit'

          # Rebuild the shell input archive so it includes the embedded framework.
          cd "$DM_ROOT/build/shell"
          rm -f nxnative-shell-build-input.zip
          rm -rf Payload
          mkdir Payload
          cp -R app Payload/DmIOS.app
          zip -qry nxnative-shell-build-input.zip Payload
          rm -rf Payload
          unzip -t nxnative-shell-build-input.zip >/dev/null
          echo "Embedded and signed NxNativeMetadataProbe.framework."
          ls -lh "$FRAMEWORK/NxNativeMetadataProbe"

      - name: Package shell as an IPA for sideload testing
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          SOURCE="$DM_ROOT/build/shell/nxnative-shell-build-input.zip"
          IPA="$DM_ROOT/build/shell/nxnative-universal-shell.ipa"
          test -s "$SOURCE"
          cp "$SOURCE" "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | grep -qx 'Payload/DmIOS.app/Info.plist'
          unzip -Z1 "$IPA" | grep -qx 'Payload/DmIOS.app/DmIOS'
          echo "Created IPA-format package:"
          ls -lh "$IPA"

      - name: Verify import screen was compiled into the app
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          APP="$DM_ROOT/build/shell/app"
          test -s "$APP/DmIOS" || { echo "::error::Missing compiled app executable: $APP/DmIOS"; exit 1; }

          # The overlay application step already verifies the source copy.
          # Check the actual Mach-O bytes directly to avoid brittle path/grep checks.
          python3 - "$APP/DmIOS" <<'PY'
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1])
          data = binary.read_bytes()
          required = (b"ImportScreenView", b"_dm_show_import_screen", b"NxNativeMetadataProbe.framework", b"nxn_inspect_nsp", b"nxn_extract_game", b"nxn_extract_dlc", b"nxn_inspect_nso", b"nxn_rewrite_nso", b"nxn_arm64_encoder_selftest", b"nxn_arm64_disassemble_nso")
          missing = [item.decode() for item in required if item not in data]
          if missing:
              print("::error::Compiled import screen symbols missing: " + ", ".join(missing))
              raise SystemExit(1)
          print("Import screen view and native bridge are present in the compiled app.")
          PY

      - name: Verify shell contains no game payload
        shell: bash
        env:
          DM_ROOT: ${{ runner.temp }}/nxnative-shell
        run: |
          set -euo pipefail
          APP="$DM_ROOT/build/shell/app"
          test -d "$APP"
          test -s "$APP/dm/shell_info.txt"
          grep -q '^KIND=ios$' "$APP/dm/shell_info.txt"
          grep -q '^GUEST=1$' "$APP/dm/shell_info.txt"
          grep -q '^ENV=1$' "$APP/dm/shell_info.txt"
          for item in romfs msl aoc; do
            if [ -e "$APP/$item" ]; then
              echo "::error::Game-specific payload unexpectedly present: $item"
              exit 1
            fi
          done
          if find "$APP" -type f \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nca' -o -iname '*.tik' -o -iname '*.keys' -o -iname 'prod.keys' \) | grep -q .; then
            echo "::error::A game package or key file was found in the shell."
            exit 1
          fi
          test -s "$APP/Frameworks/NxNativeMetadataProbe.framework/NxNativeMetadataProbe" || {
            echo "::error::The LibHac metadata framework is missing from the app."
            exit 1
          }
          if find "$APP/Frameworks" -mindepth 1 -maxdepth 1 ! -name 'NxNativeMetadataProbe.framework' ! -name 'NxNativeArm64.framework' | grep -q .; then
            echo "::error::Unexpected framework or game module found in the shell."
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          echo "Shell metadata:"
          cat "$APP/dm/shell_info.txt"
          echo "Shell file count: $(find "$APP" -type f | wc -l | tr -d ' ')"

      - name: Upload universal shell build input
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-universal-shell
          path: ${{ runner.temp }}/nxnative-shell/build/shell/nxnative-shell-build-input.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload sideloadable IPA package
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-universal-shell-ipa
          path: ${{ runner.temp }}/nxnative-shell/build/shell/nxnative-universal-shell.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-shell-diagnostics
          path: ${{ runner.temp }}/nxnative-shell/build/shell/
          if-no-files-found: warn
          retention-days: 7
