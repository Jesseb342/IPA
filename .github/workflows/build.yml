name: Parabox Lightweight IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout NxNative BC-texture fallback
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      
      - name: Checkout LibHac iOS extractor
        uses: actions/checkout@v4
        with:
          repository: Jesseb342/IPA
          ref: libhac-ios-aot-probe
          path: ipa-tools
      
      - name: Build LibHac iOS ARM64 static library
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ipa-tools/tools/LibHacAotProbe/LibHacAotProbe.csproj \
            --configuration Release --runtime ios-arm64 --verbosity minimal
          LIB="ipa-tools/tools/LibHacAotProbe/bin/Release/net10.0/ios-arm64/publish/LibHacAotProbe.a"
          test -s "$LIB"
          cp "$LIB" "$RUNNER_TEMP/LibHacAotProbe.a"
          echo "NativeAOT archive:"
          ls -lh "$RUNNER_TEMP/LibHacAotProbe.a"
          xcrun nm -gU "$RUNNER_TEMP/LibHacAotProbe.a" | grep -E 'parabox_extract_base_romfs$'
          # The exported C entry point above is the required integration check.
          # NativeAOT runtime initialization symbols are toolchain-version dependent.

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools backports.zstd gdown

      - name: Download Parabox base game and decode prod.keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          KEYS_BASE64: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/parabox"
          DOWNLOAD="$WORK/game.download"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$WORK" "$GAME_DIR"

          if [[ -z "${GAME_URL:-}" ]]; then
            echo "::error::Game_URL secret is empty."
            exit 1
          fi
          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Keys_URL secret is empty."
            exit 1
          fi

          # Google Drive share links need Drive's confirmation/download flow;
          # curl alone often saves the HTML interstitial instead of the archive.
          if [[ "$GAME_URL" == *"drive.google.com"* || "$GAME_URL" == *"docs.google.com"* ]]; then
            echo "Google Drive URL detected; downloading with gdown."
            gdown "$GAME_URL" -O "$DOWNLOAD.part"
          else
            curl --fail --location --show-error --progress-bar \
              --retry 3 --retry-delay 5 --connect-timeout 30 \
              --output "$DOWNLOAD.part" "$GAME_URL"
          fi
          test -s "$DOWNLOAD.part"
          mv "$DOWNLOAD.part" "$DOWNLOAD"

          echo "Downloaded file details:"
          ls -lh "$DOWNLOAD"
          file "$DOWNLOAD"
          python - "$DOWNLOAD" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          with p.open("rb") as f:
              head = f.read(16)
          print("First 16 bytes (hex):", head.hex(" "))
          print("First bytes (text):", repr(head[:16]))
          PY

          python - "$WORK/prod.keys" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          encoded = re.sub(r"\s+", "", os.environ["KEYS_BASE64"].strip())
          try:
              keys = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Keys_URL is not valid Base64: {exc}")
          if not keys:
              raise SystemExit("Decoded prod.keys is empty.")
          Path(sys.argv[1]).write_bytes(keys)
          Path(sys.argv[1]).chmod(0o600)
          print(f"prod.keys decoded: {len(keys):,} bytes (contents not displayed)")
          PY

          python - "$DOWNLOAD" "$GAME_DIR" "$WORK/extracted" <<'PY'
          import shutil, subprocess, sys
          from pathlib import Path

          source, game_dir, extract_dir = map(Path, sys.argv[1:])
          game_dir.mkdir(parents=True, exist_ok=True)
          extract_dir.mkdir(parents=True, exist_ok=True)

          with source.open("rb") as f:
              signature = f.read(8)

          rar_signatures = (b"Rar!\\x1a\\x07\\x00", b"Rar!\\x1a\\x07\\x01\\x00")
          if any(signature.startswith(s) for s in rar_signatures):
              print("RAR archive detected; extracting game package.")
              subprocess.run(["unar", "-o", str(extract_dir), str(source)], check=True)
              packages = sorted(p for p in extract_dir.rglob("*")
                                if p.is_file() and p.suffix.lower() in {".nsp", ".xci"})
              if not packages:
                  raise SystemExit("RAR archive contained no NSP or XCI package.")
              for p in packages:
                  target = game_dir / p.name
                  if target.exists():
                      raise SystemExit(f"Duplicate package filename: {p.name}")
                  shutil.copy2(p, target)
                  print(f"Prepared {target.name}: {target.stat().st_size:,} bytes")
          elif signature[:4] == b"PFS0":
              target = game_dir / "base.nsp"
              shutil.copy2(source, target)
              print(f"Direct NSP detected: {target.stat().st_size:,} bytes")
          elif signature[:4] == b"HEAD":
              target = game_dir / "base.xci"
              shutil.copy2(source, target)
              print(f"Direct XCI detected: {target.stat().st_size:,} bytes")
          else:
              if signature[:4].lstrip().lower().startswith((b"<", b"<!do", b"<htm")):
                  detail = "The URL returned HTML, likely a Google Drive confirmation or permission page."
              else:
                  detail = "The URL returned an unrecognized file/archive format."
              raise SystemExit(f"{detail} First bytes: {signature.hex(' ')}")

          if not any(p.is_file() and p.suffix.lower() in {".nsp", ".xci"} for p in game_dir.iterdir()):
              raise SystemExit("No supported base game package was prepared.")
          PY

      - name: Configure IPA to keep RomFS external
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("dm/ios/tools/build_ipa.sh")
          source = path.read_text()
          old = 'MAPS+=("$P/romfs=$ROMFS")'
          new = '''# This project intentionally leaves the game RomFS out of the IPA.
          # The iOS importer will place it at Documents/romfs on first launch.
          if [ "${DM_BUNDLE_ROMFS:-0}" = 1 ]; then MAPS+=("$P/romfs=$ROMFS"); fi'''
          if source.count(old) != 1:
              raise SystemExit("Expected RomFS packaging line was not found exactly once; refusing to patch.")
          path.write_text(source.replace(old, new, 1))
          print("Configured the build to omit game RomFS from the IPA.")
          PY

          # Replace the old folder-only importer with the on-device NSP + prod.keys extractor.
          python ipa-tools/tools/patch_parabox_ios.py "$GITHUB_WORKSPACE"
      - name: Detect game title ID and select shader profile
        shell: bash
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"
          echo "NxNative will select an existing profile or generate a survey and provisional profile automatically."

          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      # ================================================
      # MATCH THE SHADER TOOL LOCK TO THIS RUNNER
      # The upstream lock records exact spirv-cross / Metal versions.
      # GitHub-hosted macOS images can ship different versions, so refresh
      # the lock and chain header after the game profile is selected.
      # This keeps the shader cache and generated iOS libraries tied to
      # the actual toolchain used for this build.
      # ================================================

      - name: Adapt shader translation lock to runner
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_ipa_from_nsp.py")
          source = path.read_text()

          old = """    PROG.stage('iOS shaders')
              if provisional:
                  PROG.set(step='chain header')
                  run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)   # the profile's chain version header (dmsh_build checks it)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          new = """    PROG.stage('iOS shaders')
              PROG.set(step='toolchain lock')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--update-lock'], logs / 'dmsh_chain_lock.log', env=env)
              PROG.set(step='chain header')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          if old not in source:
              raise SystemExit(
                  "Could not find the expected nxnative shader-chain block; "
                  "refusing to patch an unknown source version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Patched shader build to refresh the tool lock and chain header.")
          PY

      - name: Build Parabox IPA
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          WORK="$RUNNER_TEMP/parabox"
          OUTPUT="$RUNNER_TEMP/Parabox-Lightweight.ipa"

          DM_LIBHAC_AOT_LIB="$RUNNER_TEMP/LibHacAotProbe.a" \
          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          test -s "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Parabox-Lightweight-IPA
          path: ${{ runner.temp }}/Parabox-Lightweight.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$DEST"
          shopt -s nullglob
          for dir in "$RUNNER_TEMP"/GameFiles/*_build/logs "$RUNNER_TEMP"/GameFiles/*_build/ipa/build/ios/pkg; do
            if [ -d "$dir" ]; then
              name="$(echo "$dir" | sed "s#^$RUNNER_TEMP/GameFiles/##; s#/#_#g")"
              mkdir -p "$DEST/$name"
              cp -R "$dir/." "$DEST/$name/"
            fi
          done
          find "$DEST" -type f -print
          
      - name: Upload build logs and survey/profile data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Parabox-Build-Diagnostics
          path: ${{ github.workspace }}/build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up game data and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/parabox" "$RUNNER_TEMP/GameFiles"
